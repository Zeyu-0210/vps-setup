# XcodeGen 工程描述。不用手动改：setup.sh 会用它生成 ZeyuVPN.xcodeproj。
# ${BUNDLE_ID} 和 ${TEAM_ID} 由 setup.sh 传入。
name: ZeyuVPN
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # 主 App：界面、导入节点、开关 VPN
  ZeyuVPN:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ZeyuVPN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/ZeyuVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Tunnel

  # VPN 扩展：真正转发流量的部分，里面跑 Xray 内核
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
      - path: Resources # geoip.dat / geosite.dat，setup.sh 下载
        buildPhase: resources
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: ZeyuVPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Frameworks/LibXray.xcframework # setup.sh 编译
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tunnel
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
